<script>
const API_URL='https://script.google.com/macros/s/AKfycbz5U9eNaG8ebcrGWBumj8xWMAwZBbyL3jYRLG-RMfCYMVkNwpnOO6IYHXKGbYmAjoNb/exec', LOGO_URL='' /* isi URL logo instansi (opsional) */;
let S=JSON.parse(localStorage.siaga||'null'),tab='home',cfg={},logoImg=null;
const $=s=>document.querySelector(s),sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function api(a,d={},btn,q){if(btn)btn.classList.add('busy'),btn.disabled=true;
 const ac=new AbortController(),tmo=setTimeout(()=>ac.abort(),40000);
 try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:a,token:S&&S.token,...d}),signal:ac.signal}).then(r=>r.json());

  if(r.expired&&q!==2)logout();if(q!==2){if(!r.ok)toast('⚠ '+(r.msg==='Aksi tidak dikenal'?'Server belum diperbarui. Admin: tempel Code.gs terbaru lalu Deploy → New version.':(r.msg||'Gagal')));else if(r.msg)toast('✔ '+r.msg)}return r}
 catch(e){if(!q)toast(e&&e.name==='AbortError'?'⚠ Server lambat merespons':'⚠ Koneksi gagal');return{ok:false,net:true}}finally{clearTimeout(tmo);if(btn)btn.classList.remove('busy'),btn.disabled=false}}
const B=(t,f,c='')=>`<button class="${c}" onclick="${f}(this)"><span class="sp"></span>${t}</button>`;
// ===== GPS + deteksi Fake GPS =====
function gps(){return new Promise((ok,no)=>{let p=[];const w=navigator.geolocation.watchPosition(x=>{p.push(x);if(p.length>=3){navigator.geolocation.clearWatch(w);
 const a=p[p.length-1].coords,f=p.every(q=>q.coords.accuracy===0)||a.accuracy<1||(p.every(q=>q.coords.latitude===a.latitude&&q.coords.longitude===a.longitude&&q.coords.altitude===null&&q.coords.speed===null&&a.accuracy%1===0&&a.accuracy>0&&a.accuracy<5));
 ok({lat:a.latitude,lng:a.longitude,acc:a.accuracy,fake:f})}},e=>{toast('⚠ Aktifkan GPS');no(e)},{enableHighAccuracy:true,timeout:20000});})}
// ===== Kamera langsung (tanpa galeri) + watermark + resize =====
let camR,camW=720,camQ=.6;async function foto(fc){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:fc||'environment'}});$('#v').srcObject=st;$('#cam').style.display='flex';
 return new Promise(r=>camR=a=>{st.getTracks().forEach(t=>t.stop());$('#cam').style.display='none';r(a)})}
function camX(ok){if(!ok)return camR(null);const v=$('#v'),W=camW,H=Math.round(W*v.videoHeight/v.videoWidth),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.drawImage(v,0,0,W,H);camR(c)}
async function shot(g,fc){const c=await foto(fc);if(!c)return null;const x=c.getContext('2d'),t=new Date().toLocaleString('id-ID')+' | '+g.lat.toFixed(6)+','+g.lng.toFixed(6)+' | '+S.user.nama;
 x.fillStyle='#000a';x.fillRect(0,c.height-30,c.width,30);x.fillStyle='#fff';x.font='14px sans-serif';x.fillText(t,8,c.height-10);
 x.fillStyle='#fff';x.beginPath();x.arc(36,36,26,0,7);x.fill();if(logoImg)x.drawImage(logoImg,12,12,48,48);else{x.fillStyle='#1558d6';x.font='bold 28px sans-serif';x.fillText('S',27,46)}
 return c.toDataURL('image/jpeg',camQ)}
// ===== Auth =====
function login_(){$('#m').innerHTML=`<div class="card" style="margin-top:40px;text-align:center"><div class="logo" style="margin:auto;width:64px;height:64px;font-size:32px;background:var(--b);color:#fff">S</div><h2 style="margin:8px 0 0;color:var(--b)">SIAGA</h2><p style="color:var(--g);margin-top:0">Respect, Respon, Report, Reaction</p>
<input id="u" placeholder="Username" autocapitalize="none"><input id="p" type="password" placeholder="Password">${B('Masuk','doLogin')}</div>`;$('#nv').innerHTML='';$('#who').textContent=''}
async function doLogin(b){const r=await api('login',{username:$('#u').value.trim(),hash:await sha($('#p').value)},b);if(r.ok){S=r;localStorage.siaga=JSON.stringify(S);start()}}
function logout(){if(S&&S.token)api('logout',{},null,2);clearInterval(window.ri);clearInterval(window.si);$('#sy').style.display='none';$('#ac').style.display='none';localStorage.removeItem('siaga');S=null;login_()}
function start(){cfg=S.cfg;$('#who').textContent=S.user.nama+' · '+S.user.role;
 const n=[['home','🏠','Beranda'],['absen','🕘','Absen'],['kerja',tm().ic,KL[S.user.tim]||'Kerja'],['rekap','📊','Rekap'],['lap','📈','Laporan']];
 if(S.user.role!=='user')n.push(['admin','⚙','Admin']);
 $('#nv').innerHTML=n.map(x=>`<a href="#" data-t="${x[0]}" onclick="go('${x[0]}');return false">${x[1]}<br>${x[2]}</a>`).join('');go('home');remindOn();offInit()}
function go(t){if(S&&S.user.wajibGanti){pwForm(true);return}tab=t;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==t));({home,absen,kerja,rekap,lap,admin})[t]()}
// ===== Halaman =====
const KL={kebersihan:'Kerja',security:'Tugas',maintenance:'Tiket',unitusaha:'Usaha',admin:'Tugas',ipl:'Tagih'},RT={kebersihan:['Kerja','Tiket'],admin:['Kerja'],security:['Patroli','Tamu','Kegiatan','LokasiTugas','Tiket'],maintenance:['Tiket'],unitusaha:['Usaha','Kerja'],ipl:['IPL']};
const rekapTabs=()=>S.user.role!=='user'?['Absen','Kerja','Patroli','Usaha','Tiket','IPL','Tamu','Kegiatan','LokasiTugas']:['Absen',...(RT[S.user.tim]||['Kerja'])];
function dashHtml(d,u,T){const gb=(t,l)=>`<button onclick="go('${t}')">${l}</button>`;let h='';
 if(u.tim==='security')h+=`<div class="card"><b>🛡 Tugas Security</b>${stat([['Patroli hari ini',d.patroli||0],['Shift sekarang',d.shift||'-'],['Tamu di dalam',d.tamuDalam||0]])}<div style="font-size:13px;margin:4px 0;line-height:1.6">📅 Jadwal hari ini: <b>${esc(d.jadwal||'belum diatur')}</b><br>📍 Lokasi bertugas: <b>${d.lokasi?esc(d.lokasi.lokasi):'belum diisi'}</b></div><div id="hps">Memuat status blok…</div><div style="font-size:13px;margin:4px 0">📋 Kegiatan hari ini: <b>${(d.kegiatan||{}).hariIni||0}</b> (berlangsung: <b>${(d.kegiatan||{}).berlangsung||0}</b>)</div><div class="row" style="grid-template-columns:repeat(3,1fr)"><button style="padding:10px 2px;font-size:12px" onclick="sm='tamu';go('kerja')">👥 Tamu</button><button style="padding:10px 2px;font-size:12px" onclick="sm='kg';go('kerja')">📋 Kegiatan</button><button class="o" style="padding:10px 2px;font-size:12px" onclick="sm='pat';go('kerja')">🛡 Patroli</button></div></div>`;

   const k=d.kerja||{total:0,jenis:[],blokCount:0,bloks:[]};
   const trgHtml = u.tim==='kebersihan' ? `<div style="background:#f0f7ff;border:1px solid #cce3ff;padding:8px 10px;border-radius:10px;font-size:12px;margin:8px 0;line-height:1.5">
     🎯 <b>Target Harian Tim Kebersihan:</b><br>

     • Pengangkutan sampah: <b>Semua Blok/hari</b><br>

   h+=`<div class="card"><b>${T.ic} Pekerjaan Hari Ini</b>${stat([['Laporan terkirim',k.total],['Blok tergarap',k.blokCount||0]])}${trgHtml}${k.jenis.map(x=>`<div class="news" style="font-size:13px">${esc(x.jenis)}: <b>${x.n}</b></div>`).join('')}${gb('kerja','➕ Lapor Pekerjaan')}</div>`;

async function home(){let c=null;try{c=JSON.parse(localStorage.siagaHome||'null')}catch(e){}

async function homeDraw(r){

 {const ld=s=>{const x=new Date(s),p=v=>String(v).padStart(2,'0');return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())},pd=a=>Q.filter(x=>x.a===a&&x.st!=='rej'&&ld(x.d.ts)===tdy()).length;

const IDB=new Promise((ok,no)=>{const q=indexedDB.open('siaga',1);q.onupgradeneeded=()=>q.result.createObjectStore('q',{keyPath:'uid'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idb=async(w,f)=>{const d=await IDB;return new Promise((ok,no)=>{const t=d.transaction('q',w?'readwrite':'readonly'),r=f(t.objectStore('q'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
const qAll=()=>idb(0,s=>s.getAll()).catch(()=>[]),qPut=o=>idb(1,s=>s.put(o)),qDel=k=>idb(1,s=>s.delete(k));

let syncFail=0,syncNext=0;
async function sync(btn,auto){if(syncing||!S)return;
 if(auto){if(Date.now()<syncNext)return;try{if(!(await myQ()).some(x=>x.st!=='rej'))return}catch(e){return} /* tanpa antrean: tidak perlu sinkron */ await new Promise(r=>setTimeout(r,Math.random()*15000));if(syncing||!S)return} // jeda acak: cegah 80 HP mengirim bersamaan
 syncing=true;const sp=document.querySelectorAll('.syncb');sp.forEach(x=>x.classList.add('busy'));let ok=0,bad=0,stop='';
 try{const L=(await qAll()).filter(x=>x.user===S.user.username&&x.st!=='rej').sort((a,b)=>new Date(a.d.ts)-new Date(b.d.ts));
  for(const it of L){const body={...it.d,uid:it.uid};if(!body.ref&&(it.a==='tamuKeluar'||it.a==='kgStatus')&&it.d.uid)body.ref=it.d.uid;/* antrean lama */ const r=await api(it.a,body,null,2);
   if(r.net){stop='net';break}if(r.expired){stop='exp';break}if(r.msg==='Aksi tidak dikenal'){stop='old';break}
   if(r.ok){await qDel(it.uid);ok++}else{it.st='rej';it.err=r.msg||'Ditolak';await qPut(it);bad++}}
 }catch(e){}finally{syncing=false;sp.forEach(x=>x.classList.remove('busy'));await badge()}
 if(stop==='net'){syncFail=Math.min(syncFail+1,5);syncNext=Date.now()+Math.min(300000,20000*2**syncFail)}else if(!stop){syncFail=0;syncNext=0} // backoff bila offline/server sibuk
 if(stop==='old'){toast('⚠ Server belum diperbarui (Code.gs). Data tetap tersimpan di HP.');return}
 if(stop==='exp'){toast('🔐 Sesi habis. Login ulang untuk sinkronisasi');logout();return}
 if(ok||bad||!auto)toast(stop==='net'?'📴 Belum ada koneksi, data tetap tersimpan':ok||bad?`✔ ${ok} data tersinkron${bad?`, ⚠ ${bad} ditolak`:''}`:'✔ Tidak ada data untuk disinkronkan');
 if(ok||bad){if($('#vw-tamu'))tamuUI();else if($('#vw-kg'))kgUI();else if($('#vw-tk'))tkList()}
 if(tab==='home'&&(ok||bad))home()}

 if(!offInitDone){offInitDone=1;addEventListener('online',()=>{toast('🌐 Kembali online, sinkronisasi…');sync(null,1)});addEventListener('offline',()=>{toast('📴 Mode offline: data disimpan di HP');badge()})}}

  files.push({name:'xl/_rels/workbook.xml.rels',data:X('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')});
  files.push({name:'xl/styles.xml',data:X('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;Rp&quot; #,##0"/></numFmts><fonts count="'+fonts.length+'">'+fonts.join('')+'</fonts><fills count="'+fills.length+'">'+fills.join('')+'</fills><borders count="'+borders.length+'">'+borders.join('')+'</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="'+xfs.length+'">'+xfs.join('')+'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')});
  sheetXml.forEach((x,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:X(x)}));
  return zip(files)}

// ============================ PREVIEW HTML ============================
function html(m){let h='<div class="rp-doc">'+(m.meta?'<div class="rp-meta">'+E(m.meta)+'</div>':'');
  for(const b of m.blocks){
    if(b.k==='banner')h+='<div class="rp-banner">'+E(b.text)+(b.sub?'<span>'+E(b.sub)+'</span>':'')+'</div>';
    else if(b.k==='heading')h+='<div class="rp-head">'+E(b.text)+'</div>';
    else if(b.k==='note')h+='<p class="rp-note">'+E(b.text)+'</p>';
    else if(b.k==='kpi')h+='<div class="rp-kpis">'+b.items.map(k=>'<div class="rp-kpi"><b>'+E(k.value)+'</b><span>'+E(k.label)+'</span></div>').join('')+'</div>';
    else if(b.k==='group')h+='<div class="rp-group"><span>'+E(b.text)+'</span><small>'+E(b.note||'')+'</small></div>';
    else if(b.k==='table'){
      if(!b.rows.length){h+='<p class="rp-note">Tidak ada data.</p>';continue}
      const cell=(c,col,tag)=>{const al=isNumCol(col)?' class="rp-r"':'';if(isLink(c))return '<td>'+(c.u&&/^https?:\/\//.test(c.u)?'<a href="'+E(c.u)+'" target="_blank" rel="noopener noreferrer">'+E(c.t||'Lihat')+'</a>':'')+'</td>';return '<'+tag+al+'>'+E(ct(c,col))+'</'+tag+'>'};
      h+='<table class="rp-t"><thead><tr>'+b.cols.map(c=>'<th>'+E(c.h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map((c,i)=>cell(c,b.cols[i],'td')).join('')+'</tr>').join('')+(b.foot?'<tr class="rp-foot">'+b.foot.map((c,i)=>cell(c,b.cols[i],'td')).join('')+'</tr>':'')+'</tbody></table>'}
  }
  return h+'</div>'}
G.RPT={pdf,xlsx,html,clean,tw,wrap};
