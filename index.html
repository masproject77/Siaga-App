async function exportXlsx(btn) {
  if (!expCfg.sections || !expCfg.sections.length) {
    return toast('⚠ Tidak ada data untuk diekspor');
  }
  const r = await api('exportXlsx', expCfg, btn);
  if (r.ok && r.base64) {
    const bin = atob(r.base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = r.filename || 'SIAGA_Laporan.xlsx';
    a.click();
    toast('✔ File Excel (.xlsx) berhasil diunduh');
  }
}

async function runLap(fn) {
  await fn();
  const lb = $('#lb');
  if (!lb || lb.innerHTML.includes('📴') || lb.innerHTML.includes('⚠')) return;

  const bFirst = lb.querySelector('b');
  const judul = bFirst ? bFirst.textContent.trim() : 'Laporan Ringkasan SIAGA';
  const statEls = [...lb.querySelectorAll('.stat')];
  const summaryItems = statEls.map(el => {
    const val = el.querySelector('b')?.textContent.trim() || '-';
    const lbl = el.textContent.replace(val, '').trim();
    return { label: lbl, value: val };
  });

  const tables = [...lb.querySelectorAll('table')];
  const sections = tables.map((tb, idx) => {
    const prevB = tb.previousElementSibling;
    const secTitle = (prevB && prevB.tagName === 'B') ? prevB.textContent.trim() : 'Tabel Bagian ' + (idx + 1);
    const headers = [...tb.querySelectorAll('th')].map(th => th.textContent.trim()).filter(h => h !== 'No');
    const rows = [...tb.querySelectorAll('tbody tr')].map(tr => {
      const cells = [...tr.querySelectorAll('td')].slice(1);
      const obj = {};
      headers.forEach((h, i) => obj[h] = cells[i] ? cells[i].textContent.trim() : '');
      return obj;
    });
    return { title: secTitle, rows: rows };
  });

  const subjudul = 'Periode: ' + (PER.includes(lt) && lpm === 'hari' ? ltg : (lt === 'ipl' && lipm === 'tahun') ? lth : (lt === 'kbp' && lkbm === 'tahun') ? lkbth : lbln);

  expCfg = {
    judul: judul,
    subjudul: subjudul,
    summary: summaryItems,
    sections: sections.length ? sections : [{ title: judul, rows: rd }]
  };

  const summaryHtml = summaryItems.length ? stat(summaryItems.map(x => [x.label, x.value])) : '';
  const clone = lb.cloneNode(true);
  clone.querySelectorAll('.row').forEach(r => r.remove());
  if (clone.firstElementChild && clone.firstElementChild.tagName === 'B') clone.firstElementChild.remove();

  lb.className = '';
  lb.innerHTML = renderDocShell(judul, subjudul, summaryHtml, clone.innerHTML);
}

let KG=[],kgFoto='',kgSrc='',kgG=null;const KGS=['Hajatan','Pertemuan Warga','Ibadah Keagamaan','Pembangunan Gedung','Perbaikan Infrastruktur','Instalasi Infrastruktur','Lainnya'];
const KGC={Terjadwal:'#1558d6',Berlangsung:'#12805c',Selesai:'#6b7a90',Dibatalkan:'#d92d20'};
async function kgUI(){$('#sf').innerHTML='<div class="card">Memuat…</div>';const r=await api('kgList',{},null,1);let c='';
 if(r.ok){KG=r.data;localStorage.siagaKg=JSON.stringify(r.data)}else if(r.net){KG=JSON.parse(localStorage.siagaKg||'[]');c='📴 Offline: menampilkan data terakhir tersimpan.'}else return;
 const ak=KG.filter(k=>['Terjadwal','Berlangsung'].includes(k.status)),sl=KG.filter(k=>!['Terjadwal','Berlangsung'].includes(k.status)).slice(0,20);
 $('#sf').innerHTML=`<div class="card"><b>📋 Izin Kegiatan (${ak.length} aktif)</b>${c?`<p style="font-size:12px;margin:4px 0">${c}</p>`:''}${B('➕ CATAT IZIN KEGIATAN','kgForm','big')}${ak.map(k=>{const ref=k.uid||k.id;return `<div class="news" style="border-color:${KGC[k.status]||'#1558d6'}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(k.nama)}</b><span style="color:#fff;background:${KGC[k.status]};border-radius:10px;padding:1px 8px;font-size:11px">${k.status}</span></div><small>${esc(k.jenis)} · ${esc(k.penyelenggara)}<br>📍 ${esc(k.lokasi)}<br>🕒 ${fmt(k.mulai)} s/d ${fmt(k.selesai)}${k.no_izin?' · Izin: '+esc(k.no_izin):''}${k.foto_izin?` · <a href="${esc(k.foto_izin)}" target=_blank rel="noopener noreferrer">Bukti izin</a>`:''}</small><div style="display:flex;gap:6px;margin-top:6px">${k.status==='Terjadwal'?`<button style="padding:6px 10px" onclick="kgSt(this,'${ref}','mulai')"><span class="sp"></span>▶ Mulai</button>`:''}${k.status==='Berlangsung'?`<button style="padding:6px 10px" onclick="kgSt(this,'${ref}','selesai')"><span class="sp"></span>✔ Selesai</button>`:''}<button class="o" style="padding:6px 10px" onclick="kgSt(this,'${ref}','batal')"><span class="sp"></span>Batalkan</button></div></div>`}).join('')||'<p style="font-size:13px;color:var(--g)">Tidak ada kegiatan terjadwal atau berlangsung.</p>'}</div>
 ${sl.length?`<div class="card"><b>Riwayat kegiatan</b>${sl.map(k=>`<div class="news" style="font-size:13px;border-color:${KGC[k.status]}"><b>${esc(k.nama)}</b> · ${k.status}<br><small style="color:var(--g)">${esc(k.jenis)} · ${esc(k.lokasi)} · ${fmt(k.mulai)}</small></div>`).join('')}</div>`:''}`}
function kgForm(){kgFoto='';kgSrc='';kgG=null;const d=tdy();
 $('#sf').innerHTML=`<div class="card"><b>➕ Catat Izin Kegiatan</b><input id="kg1" placeholder="Nama kegiatan *"><select id="kg2">${KGS.map(x=>`<option>${x}</option>`).join('')}</select><input id="kg3" placeholder="Penyelenggara / pemohon *"><input id="kg4" placeholder="No. HP penyelenggara"><input id="kg5" placeholder="Lokasi / blok / fasilitas *">
 <label style="font-size:12px;color:var(--g)">Waktu mulai *</label><input id="kg6" type="datetime-local" value="${d}T08:00"><label style="font-size:12px;color:var(--g)">Waktu selesai *</label><input id="kg7" type="datetime-local" value="${d}T17:00">
 <input id="kg8" type="number" inputmode="numeric" min="0" placeholder="Perkiraan jumlah peserta / pekerja"><input id="kg9" placeholder="Nomor surat izin"><input id="kg10" placeholder="Penerbit izin (RT / RW / Pengelola / Kelurahan)">
 <label style="font-size:12px;color:var(--g)">Foto surat / bukti izin dari Lingkungan *</label><div class="row" style="grid-template-columns:1fr 1fr"><button class="o" onclick="kgSnap(this,'kamera')">📷 Kamera</button><button class="o" onclick="kgSnap(this,'galeri')">🖼 Galeri</button></div><div id="kgfs" style="font-size:12px;color:var(--g)">Belum diambil</div>
 <textarea id="kg11" placeholder="Catatan pengamanan (parkir, rekayasa lalu lintas, kebisingan, dll.)"></textarea>${B('💾 Simpan Izin Kegiatan','kgSubmit')}${B('Batal','kgUI','o')}</div>`}
async function kgSnap(b,src){const p=await getFoto(src);if(p){kgFoto=p.f;kgG=p.g;kgSrc=src;$('#kgfs').textContent='✔ Bukti izin terlampir ('+src+')'}}
async function kgSubmit(b){const nama=$('#kg1').value.trim(),pen=$('#kg3').value.trim(),lok=$('#kg5').value.trim(),m=$('#kg6').value,s=$('#kg7').value;
 if(!nama||!pen||!lok||!m||!s)return toast('⚠ Lengkapi nama, penyelenggara, lokasi, dan jadwal');if(s<=m)return toast('⚠ Waktu selesai harus setelah waktu mulai');if(!kgFoto)return toast('⚠ Lampirkan foto bukti izin dari Lingkungan');
 const g=kgG||await gps(),r=await send('kgCatat',{nama,jenis:$('#kg2').value,penyelenggara:pen,kontak:$('#kg4').value,lokasi:lok,mulai:m,selesai:s,peserta:$('#kg8').value,no_izin:$('#kg9').value,penerbit:$('#kg10').value,foto:kgFoto,sumber:kgSrc,catatan:$('#kg11').value,lat:g.lat,lng:g.lng},b);
 if(r.ok){if(r.queued){KG.unshift({id:'OFFLINE',uid:r.uid,nama,jenis:$('#kg2').value,penyelenggara:pen,lokasi:lok,mulai:m,selesai:s,no_izin:$('#kg9').value,status:'Terjadwal'});localStorage.siagaKg=JSON.stringify(KG)}kgUI()}}
async function kgSt(b,ref,aksi){let cat='';if(aksi==='batal'){if(!confirm('Batalkan kegiatan ini?'))return;cat=prompt('Alasan pembatalan:')||'';}else if(aksi==='selesai'){cat=prompt('Catatan akhir kegiatan (opsional):');if(cat===null)return}
 const r=await send('kgStatus',{ref,aksi,catatan:cat},b);if(r.ok){const k=KG.find(x=>(x.uid||x.id)===ref);if(k){k.status=aksi==='mulai'?'Berlangsung':aksi==='selesai'?'Selesai':'Dibatalkan';localStorage.siagaKg=JSON.stringify(KG)}kgUI()}}
async function lTam(){const r=await api('sumTamu',{tanggal:ltg,bulan:lbln},null,1);if(!r.ok){$('#lb').innerHTML=r.net?off_:'⚠ '+r.msg;return}
 const d=r.data,hr=lpm==='hari',H=hr?d.harian:d.bulanan;let h=`<b>Buku Tamu ${hr?d.tanggal:d.bulan}</b>`+stat([['Total tamu',H.total],['Masih di dalam',H.dalam],['Kartu terpakai',d.kartuDipakai+'/'+(+cfg.jumlah_kartu_tamu||30)]]);
 h+='<b>Per keperluan</b>'+tbl(H.perKeperluan.map(x=>({Keperluan:x.k,Jumlah:x.n})))+'<hr class="np"><b>Per petugas</b>'+tbl(H.perPetugas.map(x=>({Petugas:x.k,Jumlah:x.n})));
 if(!hr)h+='<hr class="np"><b>Per hari</b>'+tbl(H.perHari.map(x=>({Tanggal:x.tanggal,Tamu:x.n})));
 const L=H.daftar.map(x=>({ID:x.id,Tanggal:x.tanggal,Masuk:x.jam,Keluar:x.keluar||'-',Kartu:x.kartu||'-',Kembali:x.kembali,Nama:x.nama,Asal:x.asal,Tujuan:x.tujuan,Keperluan:x.keperluan,'No. Pol':x.plat,Status:x.status,Petugas:x.petugas}));
 h+='<hr class="np"><b>Daftar tamu</b>'+tbl(L);rd=L;xn='Tamu_'+(hr?d.tanggal:d.bulan);$('#lb').innerHTML=h}
async function lKg(){const r=await api('sumKegiatan',{tanggal:ltg,bulan:lbln},null,1);if(!r.ok){$('#lb').innerHTML=r.net?off_:'⚠ '+r.msg;return}
 const d=r.data,hr=lpm==='hari',H=hr?d.harian:d.bulanan;let h=`<b>Izin Kegiatan ${hr?d.tanggal:d.bulan}</b>`+stat([['Kegiatan',H.total],['Berlangsung',H.berlangsung],['Selesai',H.selesai],['Perkiraan peserta',H.peserta]]);
 h+='<b>Per jenis kegiatan</b>'+tbl(H.perJenis.map(x=>({Jenis:x.k,Jumlah:x.n})))+'<hr class="np"><b>Per petugas</b>'+tbl(H.perPetugas.map(x=>({Petugas:x.k,Jumlah:x.n})));
 if(!hr)h+='<hr class="np"><b>Per hari</b>'+tbl(H.perHari.map(x=>({Tanggal:x.tanggal,Kegiatan:x.n})));
 const L=H.daftar.map(x=>({ID:x.id,Kegiatan:x.nama,Jenis:x.jenis,Penyelenggara:x.penyelenggara,Lokasi:x.lokasi,Mulai:fmt(x.mulai),Selesai:fmt(x.selesai),Peserta:x.peserta,'No. Izin':x.no_izin,Penerbit:x.penerbit,Status:x.status,Petugas:x.petugas}));
 h+='<hr class="np"><b>Daftar kegiatan</b>'+tbl(L);rd=L;xn='Kegiatan_'+(hr?d.tanggal:d.bulan);$('#lb').innerHTML=h}
async function lLoc(){const r=await api('lokasiList',{},null,1);if(!r.ok){$('#lb').innerHTML=r.net?off_:'⚠ '+r.msg;return}
 const L=r.data.terakhir.map(x=>({Petugas:x.nama,'Lokasi terakhir':x.lokasi||'(belum diisi)',Diperbarui:x.ts?fmt(x.ts):'-',Selfie:x.foto||''}));
 rd=L;xn='Lokasi_Security';$('#lb').innerHTML='<b>Lokasi Bertugas Security Terakhir</b>'+tbl(L)}
// ===== Offline Queue (IndexedDB) + Sinkronisasi =====
const TIM={
  kebersihan:{n:'Kebersihan',ic:'🧹',j:['Cek Saluran Air','Potong Rumput','Potong Ranting','Sapu Jalan','Pengangkutan Sampah','Pembersihan Aliran Sungai']},
  security:{n:'Security',ic:'🛡',j:['Patroli','Pengamanan Tamu','Penanganan Gangguan','Lainnya']},
  maintenance:{n:'Maintenance',ic:'🔧'},
  unitusaha:{n:'Unit Usaha',ic:'🏪',j:['Pengelolaan TPS','Operasional Harian','Lainnya']},
  ipl:{n:'Penagihan IPL',ic:'💳'},
  admin:{n:'Admin',ic:'⚙',j:['Koordinasi','Inspeksi','Lainnya']}
};
const tm=()=>TIM[S.user.tim]||TIM.admin;
let dbp;const idb=()=>dbp||(dbp=new Promise((ok,no)=>{const q=indexedDB.open('siaga',1);q.onupgradeneeded=()=>q.result.createObjectStore('q',{keyPath:'uid'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const qAdd=async x=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('q','readwrite');t.objectStore('q').put(x);t.oncomplete=ok;t.onerror=no})};
const qAll=async()=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('q').objectStore('q').getAll();q.onsuccess=()=>ok(q.result);q.onerror=no})};
const qDel=async u=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('q','readwrite');t.objectStore('q').delete(u);t.oncomplete=ok;t.onerror=no})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const lbl=x=>({absen:'Absen '+x.d.tipe,kerja:'Kerja: '+x.d.jenis,patroli:'Patroli '+x.d.kode,darurat:'Darurat',usaha:'Usaha: '+x.d.jenis,tiketBuat:'Tiket: '+x.d.kategori,tiketMulai:'Mulai '+x.d.id,tiketSelesai:'Selesai '+x.d.id,ipl:'IPL '+x.d.blok+'-'+x.d.rumah,lokasiSet:'Lokasi: '+x.d.lokasi,tamuCatat:'Tamu: '+x.d.nama,tamuKeluar:'Tamu keluar',kgCatat:'Kegiatan: '+x.d.nama,kgStatus:'Kegiatan '+x.d.aksi}[x.a]||x.a);
async function send(a,d,btn){d.uid=uid();d.ts=new Date().toISOString();const r=await api(a,{...d,off:0},btn,1);if(r.ok)return r;
 if(r.net){await qAdd({uid:d.uid,a,d,user:S.user.username,st:'pend',err:''});toast('📴 Offline: tersimpan di antrean, akan dikirim saat online');badge();return{ok:true,queued:true,uid:d.uid}}return r}
async function badge(){const b=$('#sy'),ac=$('#ac');if(!b)return;b.style.display=S?'flex':'none';if(ac)ac.style.display=S?'flex':'none';if(!S)return;const L=(await qAll()).filter(x=>x.user===S.user.username),p=L.filter(x=>x.st==='pend').length,e=L.length-p;
 $('#sn').textContent=e?'⚠'+e:p?'↑'+p:'⟳';b.style.background=e?'#fde8e6':p?'#fff6e0':'#fff';b.style.color=e?'#d92d20':p?'#b45309':'var(--b)'}
async function sync(btn){if(!S)return;if(btn)btn.classList.add('busy');let ok=0;
 try{const L=(await qAll()).filter(x=>x.user===S.user.username&&x.st==='pend').sort((a,b)=>a.d.ts<b.d.ts?-1:1);
  for(const x of L){const r=await api(x.a,{...x.d,off:1},null,1);if(r.ok){await qDel(x.uid);ok++}else if(r.net)break;else{x.st='rej';x.err=r.msg||'Ditolak server';await qAdd(x)}}
  const tk=await api('titik',{},null,2);if(tk.ok)localStorage.siagaTitik=JSON.stringify(tk.data);
  const kt=await api('katalog',{},null,2);if(kt.ok)localStorage.siagaKat=JSON.stringify(kt.data);
  if(ok)toast('✔ '+ok+' laporan tersinkron');else if(btn)toast(L.length?'⚠ Gagal sinkron, cek koneksi':'✔ Semua data sudah tersinkron')}
 finally{if(btn)btn.classList.remove('busy');badge();if(tab==='home')home()}}
async function qrm(u){await qDel(u);badge();home()}
function offInit(){badge();clearInterval(window.si);window.si=setInterval(()=>{if(navigator.onLine)sync()},60000);if(navigator.onLine)sync()}
addEventListener('online',()=>{toast('🌐 Kembali online, menyinkronkan…');sync()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
S?start():login_();
</script></body></html>
